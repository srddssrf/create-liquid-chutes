plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}


repositories {
    maven { url = "https://maven.tterrag.com/" } // Registrate
    maven { url = "https://mvn.devos.one/snapshots/" } // ONLY source for Create Fabric (?)
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes. required for Create
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel, Catnip
    maven { url = "https://mvn.devos.one/releases/" } // Porting lib
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation("com.simibubi.create:create-fabric:6.0.8.1+build.1744-mc1.20.1")
    modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.0")
    modImplementation("com.tterrag.registrate_fabric:Registrate:1.3.62-MC1.20.1")

    modApi(("io.github.fabricators_of_create.Porting-Lib:transfer:2.3.4+1.20.1"))
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    def javaVersion = JavaVersion.toVersion(17)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    //archivesBaseName = project.archives_base_name
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}